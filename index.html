<script>

const comfort=p=>G[p.g].cm[p.gl],bal=p=>1-Math.abs(p.cap-.4)-(p.susp?.05:0);

if(k<.75){const p=mk(B[Math.random()*B.length|0].id,R[Math.random()*7|0].id);p.g='tape';p.gc=Math.random()*10|0;p.gl=Math.random()*6|0;p.gp=p.gl;p.cap=[1,.7,.4,0][Math.random()*4|0];p.susp=Math.random()<.4?Math.random():0;p.lf=Math.random()<.2?1:0;p.im=Math.random()<.2?1:0;o.push({k:'pen',p,ag,t:gB(p.b).n+(p.gl||p.susp?' кастом':''),x,price:Math.round(val(p)*(.85+Math.random()*.4))})}
else if(k<.9){const r=R[Math.random()*7|0];o.push({k:'ref',r:r.id,ag,t:'Стержень: '+r.n,x,price:Math.round(r.v*(.8+Math.random()*.5))})}
else{const q=(2+Math.random()*6)|0;o.push({k:'mat',n:q,ag,t:'Материал для обмотки ×'+q,x,price:q*(15+((Math.random()*8)|0))})}}return o}
function bb(i){const b=bots[i];if(S.m<b.price)return toast('Не хватает денег');S.m-=b.price;if(b.k=='pen')S.pens.push(b.p);else if(b.k=='mat')S.st.t+=b.n;else S.st.r[b.r]=(S.st.r[b.r]||0)+1;bots.splice(i,1);sv();go()}
function mkt(){while(bots.length<50)bots.push(...mkBots(10));const pg=Math.ceil(bots.length/10);if(mp>=pg)mp=pg-1;const pager=`<div class='row'>${Array.from({length:pg},(_,i)=>`<button class='${i==mp?'on':''}' onclick='mp=${i};go()'>${i+1}</button>`).join('')}</div>`;
return `<div class='card'><h4>Продать на «Ручкин Двор»</h4><select style='width:100%' onchange='fl.pi=+this.value'>${S.pens.map((p,i)=>`<option value='${i}' ${i==fl.pi?'selected':''}>${gB(p.b).n} · ${val(p)}₽</option>`).join('')}</select><div class='row'><input placeholder='Название' value='${fl.t}' oninput='fl.t=this.value'><input placeholder='Описание' value='${fl.d}' oninput='fl.d=this.value'><input type='number' style='width:90px' value='${fl.pr}' oninput='fl.pr=+this.value'><button class='p' onclick='post()'>Выложить</button></div></div>`+
S.L.map((l,i)=>`<div class='card'>${wrap(l.p,'sm')}<b>${l.t}</b> — ${l.pr}₽<div class='m'>${l.d}</div>${l.o.map((o,j)=>`<div class='card'><span class='m'>Предложение:</span> ${o.msg}<div class='row'><button class='p' onclick='acc(${i},${j})'>Принять</button><button onclick='ctr(${i},${j})'>Торг +15%</button><button onclick='S.L[${i}].o.splice(${j},1);go()'>Отказ</button></div></div>`).join('')||`<div class='m'>Ждём покупателей…</div>`}</div>`).join('')+
`<div class='card'><h4>Объявления</h4><div class='m'>Страница ${mp+1} из ${pg}</div>${pager}</div>`+bots.slice(mp*10,mp*10+10).map((b,j)=>{const i=mp*10+j;return `<div class='card'>${b.k=='pen'?wrap(b.p,'sm'):''}<b>${b.t}</b> — ${b.price}₽<div class='m'>${b.k=='pen'?gB(b.p.b).n+' · '+gR(b.p.r).n+' · '+desc(b.p):'деталь'}</div><div class='m'>«${b.x}»</div><div class='row'><button onclick='bb(${i})'>Купить</button><button onclick='tr(${i})'>Обмен на мою</button>${b.ask?`<button class='p' onclick='pay(${i})'>Доплатить ${b.ask}₽</button>`:''}</div></div>`}).join('')+`<div class='card'>${pager}</div>`}
function openT(){const p=sel(),iw=innerWidth,ih=innerHeight,rot=ih>iw,k=Math.max(.8,Math.min(1.6,S.set.st/100)),W=(rot?ih:iw)/k,H=rot?iw:ih,r=gR(p.r);closeT();const d=document.createElement('div');d.id='tv';
d.style.cssText=`position:fixed;left:0;top:0;width:${W}px;height:${H}px;z-index:60;overflow:hidden;background:#fffdf5;background-image:linear-gradient(#cfe0f3 1px,transparent 1px),linear-gradient(90deg,#cfe0f3 1px,transparent 1px);background-size:22px 22px;transform-origin:0 0;transform:${rot?`translateX(${iw}px) rotate(90deg) `:''}scaleX(${k});`;
d.innerHTML=`<canvas id='tc' width='${W}' height='${H}' style='position:absolute;inset:0'></canvas><div id='tp' style='position:absolute;left:0;top:0;width:${Math.min(340,W*.42)}px;transform-origin:0 33%;transition:transform .07s linear;pointer-events:none'></div><div style='position:absolute;left:10px;top:10px;display:flex;gap:8px;align-items:center'><button id='tx'>✕ Выйти</button><span id='tr' class='m' style='background:#fffc;padding:6px 10px;border-radius:10px;font-size:13px'></span></div><div style='position:absolute;right:12px;bottom:${H*.4+22}px;display:flex;gap:8px'><button id='t1' class='on'>Писать</button><button id='t2'>Сильно нажать</button></div><div id='tpad' style='position:absolute;right:12px;bottom:12px;width:${Math.min(W*.36,320)}px;height:${H*.4}px;border:2.5px solid #111;border-radius:16px;background:#ffffffe0;touch-action:none;display:flex;align-items:center;justify-content:center;color:#777;box-shadow:4px 4px 0 #111'>двигай пальцем здесь</div>`;
document.body.appendChild(d);const cv=$('tc'),x=cv.getContext('2d'),pn=$('tp'),pd=$('tpad');x.lineCap='round';pn.innerHTML=svg(p);pn.querySelectorAll('.sg').forEach(g=>g.style.setProperty('--base','48deg'));
let pr=false,px=W*.3,py=H*.6,last=null,ps=0;const txt=`${r.n}: ${r.s>.9?'плавно':r.s>.8?'нормально':'местами царапает'} · хват ${Math.round(comfort(p)*100)}%`;$('tr').textContent=txt;
const mv=()=>{const j=p.lf?(Math.random()-.5)*4:0;pn.style.transform=`translate(${px+j}px,${py+j-pn.offsetHeight*.333}px) rotate(${-72+(p.lf?(Math.random()-.5)*3:0)}deg) scale(${pr?.97:1})`};mv();
const sw=v=>{pr=v;$('t1').className=v?'':'on';$('t2').className=v?'on':'';pn.className=v?'h':'';$('tr').textContent=v?'Проверка подвески: '+sus(p):txt};
$('t1').onclick=()=>sw(false);$('t2').onclick=()=>sw(true);$('tx').onclick=closeT;
let th=0,om=0,lx=px,vx=0,tt=performance.now(),fr=0,tipx=0,tvv=0;
const loop=t=>{if(!pn.isConnected)return;const dt=Math.max(.001,Math.min(.03,(t-tt)/1000));tt=t;const nvx=(px-lx)/dt,a=(nvx-vx)/dt;vx=nvx;lx=px;const q=p.susp||0,k=70,c=1.5+q*7,dr=.0007*(1.35-q)*(pr?2.2:1);om+=(-k*Math.sin(th)-c*om-dr*a+(pr?(Math.random()-.5)*60*(1.2-q):0))*dt;th=Math.max(-1.3,Math.min(1.3,th+om*dt));
pn.querySelectorAll('.sg').forEach(g=>g.style.transform=`rotate(${72+th*57.3}deg)`);
const tg=p.si?(pr?1:last?.3:0):(p.lf&&last?.12:0);tvv+=(-90*(tipx-tg)-9*tvv)*dt;tipx=Math.max(-.3,Math.min(1.3,tipx+tvv*dt));pn.querySelectorAll('.tpt').forEach(g=>g.style.transform=`translateX(${tipx*12}px)`);
if(pr&&q&&q<.4&&Math.abs(th)>.7)ps+=dt*30;
if(++fr%12==0&&pr&&(q||p.si))$('tr').textContent='Проверка подвески: '+sus(p)+(q?' · раскачка '+Math.round(Math.min(1,Math.abs(th)/1.2)*100)+'%':'')+(p.si?' · ход наконечника '+Math.round(Math.max(0,Math.min(1,tipx))*100)+'%':'');
requestAnimationFrame(loop)};requestAnimationFrame(loop);
const loc=e=>{const lx=(rot?e.clientY:e.clientX)/k,ly=rot?iw-e.clientX:e.clientY;return[(lx-pd.offsetLeft)/pd.offsetWidth*W,(ly-pd.offsetTop)/pd.offsetHeight*H]};
pd.onpointerdown=e=>{pd.setPointerCapture(e.pointerId);last=loc(e);[px,py]=last;mv()};pd.onpointerup=pd.onpointercancel=()=>last=null;
pd.onpointermove=e=>{if(!last)return;const n=loc(e);if(Math.random()<Math.min(1,r.s+(p.im?.1:0))*(pr?.8:1)*(.5+comfort(p)/2)){x.strokeStyle=p.ink||gB(p.b).sw||'#14206a';x.globalAlpha=pr?1:.85;x.lineWidth=r.w*(pr?2.2:1.2)*(.9+Math.random()*.2);x.beginPath();x.moveTo(...last);x.lineTo(...n);x.stroke()}last=n;[px,py]=n;mv();if(pr&&p.susp){ps++;if(p.susp<.4&&ps>45){p.susp=0;sv();pn.innerHTML=svg(p);$('tr').textContent='Подвеска слетела!';toast('Подвеска слетела — делай аккуратнее')}}}}
go();
</script></body></html>
